<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<meta name="theme-color" content="#1d4e89">

<style>
/* Layout: one-column phone ledger. Sticky header with sync state, four-tab bottom bar, floating "+ دفعة" button, bottom sheets for every form. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#e8eef2; --fg:#10222e; --muted:#566977; --line:#d3dde4;
  --accent:#1d4e89; --accent-fg:#ffffff; --accent-soft:#dbe7f5;
  --good:#1b7f4b; --good-soft:#dcf1e5; --warn:#8f5600; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#f9dcd9;
  --shadow:0 6px 24px rgba(16,34,46,.14);
  --f-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --f-brand:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1419; --surface:#131f27; --surface2:#1b2b35; --fg:#e6eef3; --muted:#96a9b6; --line:#28394a;
    --accent:#6aa5ee; --accent-fg:#0a1a2b; --accent-soft:#18304a;
    --good:#56c58a; --good-soft:#12301f; --warn:#e8b25a; --warn-soft:#3a2a0e; --bad:#f08a82; --bad-soft:#3d1916;
    --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1419; --surface:#131f27; --surface2:#1b2b35; --fg:#e6eef3; --muted:#96a9b6; --line:#28394a;
  --accent:#6aa5ee; --accent-fg:#0a1a2b; --accent-soft:#18304a;
  --good:#56c58a; --good-soft:#12301f; --warn:#e8b25a; --warn-soft:#3a2a0e; --bad:#f08a82; --bad-soft:#3d1916;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);direction:rtl;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-brand);font-size:22px;font-weight:600;margin:0;flex:1;letter-spacing:.2px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
main{padding-block:16px 150px;display:flex;flex-direction:column;gap:14px}
h2,h3{margin:0}
h3{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.d1{display:block}
.d2{display:block;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.summary{display:grid;gap:10px}
.sum-line{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:baseline;padding-block:8px;border-top:1px solid var(--line)}
.sum-line:first-of-type{border-top:0}
.sum-line b{font-size:13px;color:var(--muted)}
.sum-line .v{font-size:18px;font-weight:600}
.cap{font-size:12px;color:var(--muted);display:block;font-weight:400}
.alert-row{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tools{display:flex;gap:10px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
textarea.in{min-height:84px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{position:relative;flex:none}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span,.fchip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:500;white-space:nowrap;min-height:40px}
.chip input:checked+span,.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.loan{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.loan:hover{border-color:var(--accent)}
.pill{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.bar.ok i{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{min-width:0}
.stats .l{font-size:12px;color:var(--muted);display:block}
.stats .v{font-weight:600;font-size:15px}
.stats .v.big{font-size:16px;color:var(--fg)}
.foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.foot>div{min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12.5px;color:var(--muted);border-radius:10px;min-height:52px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;border:0;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:14px 22px;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(680px,100%);max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.sh-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;z-index:2}
.sh-head h2{font-size:18px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-weight:600;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);margin:0;min-height:1.2em;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:start}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.pay{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}
.pay.rev{opacity:.75}
.pay .amt{font-weight:700;font-size:16px}
.list{display:flex;flex-direction:column;gap:10px}
.deb{display:flex;gap:12px;align-items:center;cursor:pointer}
.weekdays,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekdays span{text-align:center;font-size:12px;color:var(--muted);padding-block:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:56px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.day small{font-size:10.5px;color:var(--muted);font-weight:400}
.day.out{visibility:hidden}
.day.today{border-color:var(--accent);border-width:2px}
.day[aria-pressed="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:3px;min-height:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dots i.good{background:var(--good)}
.dots i.bad{background:var(--bad)}
.dots i.warn{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.mini{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:8px}
.mini div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--muted)}
.mini i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 6px}
.toast[hidden]{display:none}
details.more>summary{cursor:pointer;color:var(--muted);padding-block:4px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{text-align:start;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:500;font-size:12.5px}
.scroll-x{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-box{width:min(340px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.lock-box h2{font-family:var(--f-brand);font-size:26px}
.pin{letter-spacing:.4em;text-align:center;font-size:24px}
@media (max-width:380px){.stats .v{font-size:13.5px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.fab{transition:border-color .15s,background .15s}}
</style>
</head><body>

<div id="app" dir="rtl" lang="ar">
  <header class="top"><div class="wrap">
    <h1 class="brand">دفتر القروض</h1>
    <span class="sync" id="sync" data-s="local">محفوظ على الجهاز</span>
    <button class="icon-btn" data-act="settings" aria-label="الإعدادات">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </div></header>
  <main class="wrap" id="view"></main>
  <button class="fab" data-act="quick">+ دفعة</button>
  <nav class="nav" aria-label="التنقل"><div class="nav-in" id="nav"></div></nav>
  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
// <logic>
const CUR={SAR:{d:2,s:'ر.س',n:'ريال'},USD:{d:2,s:'$',n:'دولار'},EUR:{d:2,s:'€',n:'يورو'},AED:{d:2,s:'د.إ',n:'درهم'},KWD:{d:3,s:'د.ك',n:'دينار'},EGP:{d:2,s:'ج.م',n:'جنيه'},JPY:{d:0,s:'¥',n:'ين'}};
const TYPES={car:'قرض سيارة',personal:'قرض شخصي',business:'قرض عمل',study:'قرض دراسة',medical:'قرض علاج',other:'قرض'};
const METHODS={cash:'نقد',transfer:'تحويل',cheque:'شيك',card:'بطاقة',other:'أخرى'};
const DAY=864e5;
const uid=()=>(globalThis.crypto&&globalThis.crypto.randomUUID)?globalThis.crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function nuDigits(s,nu){if(nu!=='arab')return s;return s.replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/,/g,'٬').replace(/\./g,'٫');}
function normDigits(s){return String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/٫/g,'.').replace(/[٬,\s]/g,'');}
function parseMoney(str,cur){
  const c=CUR[cur];if(!c)return null;const s=normDigits(str);
  if(!/^\d+(\.\d+)?$/.test(s))return null;
  const parts=s.split('.');const a=parts[0],b=parts[1]||'';
  if(b.length>c.d)return null;
  const frac=c.d?Number((b+'0'.repeat(c.d)).slice(0,c.d)):0;
  const v=Number(a)*Math.pow(10,c.d)+frac;
  return Number.isSafeInteger(v)?v:null;
}
function amountStr(minor,cur){const c=CUR[cur];const a=Math.abs(minor);const p=Math.pow(10,c.d);const major=Math.floor(a/p);const frac=a%p;return (minor<0?'-':'')+major+(c.d?'.'+String(frac).padStart(c.d,'0'):'');}
function plainAmount(minor,cur){const c=CUR[cur];const p=Math.pow(10,c.d);const a=Math.abs(minor);const major=Math.floor(a/p);const frac=a%p;let s=String(major);if(c.d&&frac)s+='.'+String(frac).padStart(c.d,'0').replace(/0+$/,'');return s;}
function fmtMoney(minor,cur,nu,full){
  const c=CUR[cur]||{d:2,s:cur};const neg=minor<0;const a=Math.abs(minor);const p=Math.pow(10,c.d);
  const major=Math.floor(a/p);const frac=a%p;
  let s=String(major).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(c.d&&(full||frac!==0))s+='.'+String(frac).padStart(c.d,'0');
  return (neg?'−':'')+nuDigits(s,nu||'latn')+' '+c.s;
}
function addMonths(ms,n){const d=new Date(ms);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getTime();}
function startOfDay(ms){const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function schedule(l){
  if(!l.dueAt)return [];
  const n=Math.max(1,l.inst||1);const base=Math.floor(l.principal/n);const out=[];let sum=0;
  for(let i=0;i<n;i++){const amount=i===n-1?l.principal-sum:base;sum+=amount;out.push({i,due:i===0?l.dueAt:addMonths(l.dueAt,i),amount});}
  return out;
}
function loanStats(l,payments,now){
  const ps=payments.filter(p=>p.loanId===l.id);
  const rev=new Set(ps.filter(p=>p.reverses).map(p=>p.reverses));
  let paid=0,last=null,count=0;
  for(const p of ps){
    if(p.reverses){paid-=p.amount;}
    else{paid+=p.amount;if(!rev.has(p.id)){count++;if(last===null||p.paidAt>last)last=p.paidAt;}}
  }
  const remaining=l.principal-paid;
  const sch=schedule(l);let cum=0;
  for(const s of sch){const start=cum;cum+=s.amount;s.paid=Math.max(0,Math.min(s.amount,paid-start));s.done=paid>=cum;s.overdue=!s.done&&now>startOfDay(s.due)+DAY-1;}
  const next=sch.find(s=>!s.done)||null;
  const status=l.cancelled?'cancelled':remaining<=0?'settled':(sch.some(s=>s.overdue)?'late':'active');
  return {paid,remaining,last,count,sch,next,status,progress:l.principal?Math.max(0,Math.min(1,paid/l.principal)):0};
}
function addPayment(S,a,now){
  if(S.payments.some(p=>p.key===a.key))return {dup:true};
  const l=S.loans.find(x=>x.id===a.loanId);if(!l)return {error:'loan'};
  if(!Number.isSafeInteger(a.amount)||a.amount<=0)return {error:'amount'};
  const st=loanStats(l,S.payments,now);
  if(st.status==='cancelled'||st.remaining<=0)return {error:'closed'};
  if(a.amount>st.remaining)return {error:'over',remaining:st.remaining};
  const p={id:uid(),loanId:a.loanId,amount:a.amount,method:a.method,paidAt:a.paidAt,recordedAt:now,tz:a.tz||'',note:a.note||'',key:a.key,reverses:null};
  S.payments.push(p);return {payment:p};
}
function reversePayment(S,pid,reason,now,tz){
  const p=S.payments.find(x=>x.id===pid);
  if(!p||p.reverses)return {error:'notfound'};
  if(S.payments.some(x=>x.reverses===pid))return {error:'already'};
  const r={id:uid(),loanId:p.loanId,amount:p.amount,method:p.method,paidAt:now,recordedAt:now,tz:tz||'',note:'',reverses:pid,reason:reason||'',key:uid()};
  S.payments.push(r);return {payment:r};
}
function csvCell(v){const s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function csvText(v){const s=String(v==null?'':v);return /^[=+\-@\t\r]/.test(s)?"'"+s:s;}
function toCSV(rows){return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function pad(n,w){return String(n).padStart(w||2,'0');}
function localISO(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function hijriYMD(ms){const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});const o={};for(const p of f.formatToParts(ms))o[p.type]=p.value;return o.year+'-'+o.month+'-'+o.day;}
function ledgerRows(S,pred){
  const byId=new Map(S.loans.map(l=>[l.id,l]));const run=new Map(S.loans.map(l=>[l.id,l.principal]));
  const ps=[...S.payments].sort((a,b)=>a.paidAt-b.paidAt||a.recordedAt-b.recordedAt);
  const rows=[];

function paymentsCSV(S,pred){

function report(S,from,to,now){

function ymKey(y,m0){return y+'-'+pad(m0+1);}
function ymParse(k){const p=k.split('-').map(Number);return {y:p[0],m:p[1]-1};}
function ymIndex(k){const o=ymParse(k);return o.y*12+o.m;}
function ymAdd(k,n){const i=ymIndex(k)+n;return ymKey(Math.floor(i/12),((i%12)+12)%12);}

function obStep(ob){return ob.freq==='yearly'?12:ob.freq==='quarterly'?3:1;}
function obActive(ob,period){
  const i=ymIndex(period),s=ymIndex(ob.startYm);
  if(i<s)return false;
  if(ob.stopYm&&i>=ymIndex(ob.stopYm))return false;
  return (i-s)%obStep(ob)===0;
}
function obPayment(S,obId,period){
  const ps=S.obpayments||[];const rev=new Set(ps.filter(p=>p.reverses).map(p=>p.reverses));
  return ps.find(p=>p.obId===obId&&p.period===period&&!p.reverses&&!rev.has(p.id))||null;
}
function obStatus(S,ob,period,now){
  const p=obPayment(S,ob.id,period);
  if(p)return {status:'paid',payment:p};
  const due=obDueMs(ob,period);
  if(now>startOfDay(due)+DAY-1)return {status:'late',payment:null};
  if(startOfDay(due)<=now+7*DAY)return {status:'soon',payment:null};
  return {status:'due',payment:null};
}
function obMonth(S,period,now){
  const items=[];const tot={};
  for(const ob of (S.obligations||[])){
    if(!obActive(ob,period))continue;
    const st=obStatus(S,ob,period,now);const due=obDueMs(ob,period);
    items.push({ob,period,due,st});
    const t=tot[ob.currency]||(tot[ob.currency]={due:0,paid:0,remaining:0,late:0});
    if(st.payment){t.due+=st.payment.amount;t.paid+=st.payment.amount;}
    else{t.due+=ob.amount;t.remaining+=ob.amount;if(st.status==='late')t.late++;}
  }

}
function addObPayment(S,a,now){
  if(!S.obpayments)S.obpayments=[];

  if(!obActive(ob,a.period))return {error:'period'};
  if(obPayment(S,ob.id,a.period))return {error:'paid'};
  if(!Number.isSafeInteger(a.amount)||a.amount<=0)return {error:'amount'};

}

function obPaymentsCSV(S){

function validateBackup(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.loans)||!Array.isArray(o.payments))return 'الملف ليس نسخة صالحة من دفتر القروض.';
  const ids=new Set();
  for(const l of o.loans){
    if(!l||typeof l.id!=='string'||!l.id||ids.has(l.id))return 'بيانات قرض غير صالحة.';
    ids.add(l.id);
    if(typeof l.debtor!=='string'||!l.debtor.trim())return 'اسم مدين مفقود في أحد القروض.';
    if(!CUR[l.currency])return 'عملة غير مدعومة: '+l.currency;
    if(!Number.isSafeInteger(l.principal)||l.principal<=0)return 'مبلغ قرض غير صالح.';
    if(l.direction!=='lent'&&l.direction!=='borrowed')return 'اتجاه قرض غير صالح.';
    if(!Number.isFinite(l.issuedAt))return 'تاريخ إصدار غير صالح.';
  }
  const pid=new Set();
  for(const p of o.payments){
    if(!p||typeof p.id!=='string'||pid.has(p.id)||!ids.has(p.loanId))return 'دفعة غير صالحة أو مرتبطة بقرض غير موجود.';
    pid.add(p.id);
    if(!Number.isSafeInteger(p.amount)||p.amount<=0)return 'مبلغ دفعة غير صالح.';
    if(!Number.isFinite(p.paidAt))return 'تاريخ دفعة غير صالح.';
  }
  const obs=o.obligations;
  if(obs!==undefined){
    if(!Array.isArray(obs))return 'بيانات الالتزامات غير صالحة.';
    const oids=new Set();
    for(const b of obs){
      if(!b||typeof b.id!=='string'||!b.id||oids.has(b.id))return 'التزام غير صالح.';
      oids.add(b.id);
      if(typeof b.name!=='string'||!b.name.trim())return 'اسم التزام مفقود.';
      if(!CUR[b.currency])return 'عملة التزام غير مدعومة.';
      if(!Number.isSafeInteger(b.amount)||b.amount<=0)return 'مبلغ التزام غير صالح.';
      if(!/^\d{4}-\d{2}$/.test(b.startYm||''))return 'شهر بداية التزام غير صالح.';
      if(!Number.isInteger(b.day)||b.day<1||b.day>31)return 'يوم استحقاق غير صالح.';
    }
    const ops=o.obpayments||[];
    if(!Array.isArray(ops))return 'دفعات الالتزامات غير صالحة.';
    const opid=new Set();
    for(const p of ops){
      if(!p||typeof p.id!=='string'||opid.has(p.id)||!oids.has(p.obId))return 'دفعة التزام غير صالحة.';
      opid.add(p.id);
      if(!Number.isSafeInteger(p.amount)||p.amount<=0||!Number.isFinite(p.paidAt)||!/^\d{4}-\d{2}$/.test(p.period||''))return 'دفعة التزام غير صالحة.';
    }
  }else if(o.obpayments&&o.obpayments.length)return 'دفعات التزامات بلا التزامات.';
  return '';
}
function normalizeBackup(o){
  return {
    loans:o.loans.map(l=>Object.assign({},l,{dueAt:l.dueAt||null,inst:l.inst||1,note:l.note||'',type:l.type||'other'})),
    payments:o.payments.map(p=>Object.assign({},p,{recordedAt:p.recordedAt||p.paidAt,method:p.method||'other',note:p.note||'',key:p.key||p.id,reverses:p.reverses||null})),

function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}

function buildICS(S,now){
  const stamp=new Date(now).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daftar Qurood//AR//','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('استحقاقات القروض')];
  let count=0;
  for(const l of (S.loans||[])){
    if(l.cancelled)continue;
    const st=loanStats(l,S.payments,now);

      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:PT9H','END:VALARM');
      L.push('END:VEVENT');count++;
    }
  }
  const nd=new Date(now);const cur=ymKey(nd.getFullYear(),nd.getMonth());
  for(const ob of (S.obligations||[])){
    for(let i=0;i<12;i++){
      const per=ymAdd(cur,i);

      if(ob.note)L.push('DESCRIPTION:'+icsEsc(ob.note));

      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:PT9H','END:VALARM');
      L.push('END:VEVENT');count++;

function summaryHTML(){

    if(x.st.status==='late')late++;

  }
  const cs=Object.keys(by);
  if(!cs.length)return '';

  const tags=(late?'<span class="tag bad">▲ '+late+' متأخر</span>':'')+(soon?'<span class="tag warn">قريب الاستحقاق: '+soon+'</span>':'');

function matchMonth(l,mo){
  if(!mo)return true;const p=mo.split('-').map(Number);const a=new Date(p[0],p[1]-1,1).getTime(),b=new Date(p[0],p[1],1).getTime();
  const inR=t=>t>=a&&t<b;
  if(inR(l.issuedAt))return true;
  if(schedule(l).some(s=>inR(s.due)))return true;
  return S.payments.some(x=>x.loanId===l.id&&inR(x.paidAt));
}

/* calendar */
function calState(){if(!UI.cal){const d=new Date();UI.cal={y:d.getFullYear(),m:d.getMonth()};}return UI.cal;}
function monthItems(y,m){
  const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime();const out={};const n=nowMs();
  for(const l of S.loans){
    if(l.cancelled)continue;const st=loanStats(l,S.payments,n);
    for(const s of st.sch){if(s.due>=a&&s.due<b){const day=new Date(s.due).getDate();(out[day]||(out[day]=[])).push({l,s,cls:s.done?'good':s.overdue?'bad':'warn'});}}
  }
  const per=ymKey(y,m);
  for(const ob of (S.obligations||[])){
    if(!obActive(ob,per))continue;
    const st=obStatus(S,ob,per,n);const due=obDueMs(ob,per);const day=new Date(due).getDate();
    (out[day]||(out[day]=[])).push({ob,per,due,st,cls:st.status==='paid'?'good':st.status==='late'?'bad':'warn'});
  }
  return out;
}

/* quick payment */
function lastMethod(){const ps=S.payments.filter(p=>!p.reverses).sort((a,b)=>b.recordedAt-a.recordedAt);return ps[0]?ps[0].method:'cash';}
function loansOf(debtor){return allStats().filter(x=>x.l.debtor===debtor&&x.st.remaining>0);}
function openQuick(loanId){
  const l=loanId?S.loans.find(x=>x.id===loanId):null;
  QP={step:1,key:uidSafe(),debtor:l?l.debtor:'',loanId:l?l.id:'',amount:'',method:lastMethod(),ts:nowMs(),note:'',err:''};
  if(!QP.debtor)QP.debtor=openDebtors()[0]||'';
  fixLoan();renderQP();
}
function uidSafe(){return uid();}
function fixLoan(){const ls=loansOf(QP.debtor);if(!ls.some(x=>x.l.id===QP.loanId))QP.loanId=ls[0]?ls[0].l.id:'';}
function curQPLoan(){const l=S.loans.find(x=>x.id===QP.loanId);return l?{l,st:loanStats(l,S.payments,nowMs())}:null;}
function autoNote(){
  const x=curQPLoan();if(!x)return '';const amt=parseMoney(QP.amount,x.l.currency);
  const a=amt?plainAmount(amt,x.l.currency)+' '+CUR[x.l.currency].n+' ':'';
  return x.l.direction==='lent'?'تم سداد '+x.l.debtor+' '+a+(TYPES[x.l.type]||'قرض'):'تم سداد '+a+'إلى '+x.l.debtor+' '+(TYPES[x.l.type]||'قرض');
}
function readQP(){
  const g=id=>{const e=$('#layer #'+id);return e?e.value:null;};
  const d=g('qp-debtor');if(d!==null)QP.debtor=d;
  const l=g('qp-loan');if(l!==null)QP.loanId=l;
  const a=g('qp-amount');if(a!==null)QP.amount=a;
  const t=g('qp-ts');if(t){const ms=new Date(t).getTime();if(!isNaN(ms))QP.ts=ms;}
  const n=g('qp-note');if(n!==null)QP.note=n;
  const m=$('#layer input[name="qp-method"]:checked');if(m)QP.method=m.value;
}
function renderQP(){
  UI.sheet='quick';
  const ds=openDebtors();
  if(!ds.length){showSheet('دفعة سريعة','<div class="empty">لا توجد قروض مفتوحة. أضف قرضاً أولاً.</div><button class="btn primary" data-act="new-loan" style="width:100%">+ قرض جديد</button>');return;}

function saveEditLoan(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;
  const v=k=>$('#layer #'+k).value;const err=m=>{$('#el-err').textContent=m;};
  const debtor=v('el-debtor').trim();if(!debtor)return err('اكتب اسم المدين.');
  const hasPay=S.payments.some(p=>p.loanId===id);
  const cur=hasPay?l.currency:v('el-cur');
  const amt=parseMoney(v('el-amount'),cur);
  if(!amt||amt<=0)return err('أدخل مبلغاً صحيحاً أكبر من صفر'+(CUR[cur].d?' بحد أقصى '+CUR[cur].d+' خانات عشرية.':' بدون كسور.'));
  const paid=loanStats(l,S.payments,nowMs()).paid;
  if(amt<paid)return err('المبلغ الأصلي أقل من المدفوع ('+fmtMoney(paid,cur,S.settings.nu)+').');
  const issued=parseDateInput(v('el-issued'));if(issued===null)return err('تاريخ الإصدار غير صحيح.');
  const dueRaw=v('el-due');const due=dueRaw?parseDateInput(dueRaw):null;if(dueRaw&&due===null)return err('تاريخ الاستحقاق غير صحيح.');
  if(due!==null&&due<issued)return err('الاستحقاق قبل تاريخ الإصدار.');
  let inst=parseInt(v('el-inst'),10);if(!(inst>=1))inst=1;if(inst>120)return err('الحد الأقصى 120 قسطاً.');
  if(inst>1&&due===null)return err('حدد تاريخ أول استحقاق لجدول الأقساط.');
  const dir=($('#layer input[name="el-dir"]:checked')||{}).value||l.direction;
  const next={debtor,direction:dir,type:v('el-type'),principal:amt,currency:cur,issuedAt:issued,dueAt:due,inst,note:v('el-note').trim()};
  const before={};let changed=false;
  for(const k of Object.keys(next)){if(l[k]!==next[k]&&!(l[k]==null&&next[k]==null)){before[k]=l[k]==null?null:l[k];changed=true;}}
  if(!changed){UI.sheet={loan:id};renderLoanSheet();return;}
  (l.history||(l.history=[])).push({at:nowMs(),from:before});
  Object.assign(l,next);save();UI.sheet={loan:id};renderLoanSheet();renderView();toast('تم حفظ التعديل');
}

function download(name,text,mime){
  return (async()=>{
    try{
      const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
      if(d){await d.save({filename:name,data:text});toast('تم تجهيز الملف '+name);return true;}
    }catch(e){if(e&&e.code==='declined')return;}
    try{
      const mt=/\.csv$/.test(name)?'text/csv':/\.json$/.test(name)?'application/json':/\.ics$/.test(name)?'text/calendar':'text/plain';
      const f=new File([text],name,{type:mt});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true;}
    }catch(e){if(e&&e.name==='AbortError')return;}
    showSheet('نسخ البيانات','<div class="form"><p class="hint">التنزيل غير متاح هنا. انسخ النص وألصقه في ملف '+esc(name)+'.</p><textarea id="cp" class="in" style="min-height:220px;direction:ltr" readonly>'+esc(text)+'</textarea><button class="btn primary" data-act="copy-text">نسخ</button></div>');
    return true;
  })();
}
function loansCSV(){
  const n=nowMs();
  const head=['المدين','الاتجاه','النوع','الأصل','العملة','تاريخ الإصدار','تاريخ الاستحقاق','المدفوع','المتبقي','الحالة','آخر دفعة','الملاحظة'];
  const rows=S.loans.map(l=>{const st=loanStats(l,S.payments,n);return [csvText(l.debtor),l.direction==='lent'?'أقرضته':'اقترضت منه',TYPES[l.type]||'',amountStr(l.principal,l.currency),l.currency,localISO(l.issuedAt).slice(0,10),l.dueAt?localISO(l.dueAt).slice(0,10):'',amountStr(st.paid,l.currency),amountStr(st.remaining,l.currency),ST[st.status][0],st.last?localISO(st.last):'',csvText(l.note)];});
  return toCSV([head].concat(rows));
}

}

function saveObForm(id){
  const ob=id?S.obligations.find(x=>x.id===id):null;
  const hasPay=!!ob&&S.obpayments.some(p=>p.obId===ob.id);
  const g=k=>$('#layer #'+k).value;const err=m=>{$('#ob-err').textContent=m;};
  const name=g('ob-name').trim();if(!name)return err('اكتب اسم الالتزام.');
  const cur=hasPay?ob.currency:g('ob-cur');
  const amt=parseMoney(g('ob-amount'),cur);
  if(!amt||amt<=0)return err('أدخل مبلغاً صحيحاً أكبر من صفر'+(CUR[cur].d?' بحد أقصى '+CUR[cur].d+' خانات عشرية.':' بدون كسور.'));
  const day=parseInt(g('ob-day'),10);if(!(day>=1&&day<=31))return err('يوم الاستحقاق من 1 إلى 31.');
  const freq=hasPay?ob.freq:g('ob-freq');
  const startYm=hasPay?ob.startYm:g('ob-start');if(!/^\d{4}-\d{2}$/.test(startYm))return err('اختر شهر أول استحقاق.');
  const cat=g('ob-cat'),note=g('ob-note').trim();
  if(ob){Object.assign(ob,{name,amount:amt,currency:cur,freq,day,startYm,cat,note});save();openOb(ob.id);renderView();toast('تم حفظ التعديل');}
  else{S.obligations.push({id:uid(),name,amount:amt,currency:cur,freq,day,startYm,cat,note,stopYm:null});save();closeSheet();UI.tab='oblig';renderView();toast('تمت إضافة الالتزام');}
}

function saveObPay(){
  if(!OP)return;const ob=S.obligations.find(x=>x.id===OP.obId);if(!ob)return;
  const err=m=>{$('#op-err').textContent=m;};
  const amt=parseMoney($('#op-amount').value,ob.currency);

  const ts=new Date($('#op-ts').value).getTime();if(isNaN(ts))return err('التاريخ غير صحيح.');
  if(ts>nowMs()+60000)return err('لا يمكن تسجيل دفعة بتاريخ مستقبلي.');
  const m=($('#layer input[name="op-method"]:checked')||{}).value||'other';
  const r=addObPayment(S,{obId:OP.obId,period:OP.period,amount:amt,method:m,paidAt:ts,note:$('#op-note').value.trim(),key:OP.key,tz:tz()},nowMs());

/* ---------- backup safety ---------- */
const AUTOKEY='daftar-qurood-auto';
function snapshotBefore(reason){
  try{if(!S.loans.length&&!S.payments.length&&!(S.obligations||[]).length)return;localStorage.setItem(AUTOKEY,JSON.stringify({at:Date.now(),reason,data:S}));}catch(e){}
}
function autoSnap(){try{const r=localStorage.getItem(AUTOKEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function autoSnapHTML(){
  const a=autoSnap();if(!a||!a.data)return '';
  return '<div class="card" style="margin-top:8px"><p class="hint">حالة محفوظة تلقائياً ('+esc(a.reason||'')+') بتاريخ:</p>'+dateHTML(a.at,{time:true})+'<p class="hint">فيها '+((a.data.loans||[]).length)+' قرض و'+((a.data.payments||[]).length)+' دفعة.</p><button class="btn sm" data-act="restore-auto">استرجاع هذه الحالة</button></div>';
}
function lastBackupText(){const t=S.settings.lastBackup;return t?'آخر نسخة جهّزتها: '+dateHTML(t,{time:true}):'لم تجهّز نسخة احتياطية بعد.';}
function backupBanner(){
  const real=S.loans.some(l=>!l.demo)||S.payments.some(p=>!p.demo)||(S.obligations||[]).length>0;
  if(!real)return '';
  const t=S.settings.lastBackup;const days=t?Math.floor((nowMs()-t)/864e5):null;
  if(t&&days<7)return '';
  const msg=t?'مرّ '+nuDigits(String(days),S.settings.nu)+' يوماً على آخر نسخة احتياطية.':'لم تحفظ نسخة احتياطية بعد، وبياناتك على هذا الجهاز فقط.';
  return '<div class="banner"><span>'+msg+'</span><button class="btn sm" data-act="export-json">احفظ نسخة الآن</button></div>';
}

function checkRestore(){

/* ---------- app lock ---------- */
const LOCKKEY='daftar-qurood-lock';
function lockData(){try{const r=localStorage.getItem(LOCKKEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function hasPin(){const d=lockData();return !!(d&&d.hash&&d.salt);}
async function pinHash(pin,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function checkPin(pin){const d=lockData();if(!d)return true;return (await pinHash(normDigits(pin),d.salt))===d.hash;}
async function setPin(pin){const salt=uid();const hash=await pinHash(pin,salt);localStorage.setItem(LOCKKEY,JSON.stringify({salt,hash}));}
function clearPin(){try{localStorage.removeItem(LOCKKEY);}catch(e){}}
function pinBoxHTML(){
  return hasPin()?'<p class="hint">القفل مفعّل. يُطلب الرمز عند فتح التطبيق وبعد غيابك عنه أكثر من دقيقة.</p><div class="row wrap2"><button class="btn" data-act="pin-change">تغيير الرمز</button><button class="btn" data-act="pin-remove">إلغاء القفل</button></div>'
   :'<p class="hint">رمز من 4 إلى 8 أرقام يُطلب عند فتح التطبيق. هو حاجز بسيط أمام من يمسك جوالك، وليس تشفيراً للبيانات.</p><button class="btn" data-act="pin-set">تفعيل القفل</button>';
}
function pinForm(mode){
  const f=(id,lab)=>'<div class="field"><label for="'+id+'">'+lab+'</label><input id="'+id+'" class="in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></div>';
  return (mode!=='set'?f('pin0','الرمز الحالي'):'')+(mode!=='remove'?f('pin1','الرمز الجديد (4 إلى 8 أرقام)')+f('pin2','تأكيد الرمز الجديد'):'')
   +'<p class="err" id="pin-err" role="alert"></p><div class="row"><button class="btn primary grow" data-act="pin-save" data-v="'+mode+'">حفظ</button><button class="btn grow" data-act="pin-cancel">إلغاء</button></div>';
}
async function savePin(mode){
  const err=m=>{const e=$('#pin-err');if(e)e.textContent=m;};
  try{
    if(mode!=='set'){const cur=($('#pin0').value||'').trim();if(!(await checkPin(cur)))return err('الرمز الحالي غير صحيح.');}
    if(mode==='remove'){clearPin();$('#pinbox').innerHTML=pinBoxHTML();toast('تم إلغاء القفل');return;}
    const a=normDigits(($('#pin1').value||'').trim()),b=normDigits(($('#pin2').value||'').trim());
    if(!/^\d{4,8}$/.test(a))return err('الرمز يجب أن يكون من 4 إلى 8 أرقام.');
    if(a!==b)return err('الرمزان غير متطابقين.');
    await setPin(a);$('#pinbox').innerHTML=pinBoxHTML();toast('تم تفعيل القفل');
  }catch(e){err('القفل غير متاح في هذا المتصفح.');}
}
let hiddenAt=0,fails=0,blockUntil=0;
function setInert(on){document.querySelectorAll('.top,main,.fab,.nav').forEach(e=>{if(on)e.setAttribute('inert','');else e.removeAttribute('inert');});}
function showLock(){
  if($('#lock'))return;closeSheet();$('#toast').hidden=true;
  const el=document.createElement('div');el.className='lock';el.id='lock';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML='<form class="lock-box" id="lock-form" novalidate><h2>دفتر القروض</h2><p class="muted">أدخل الرمز لفتح التطبيق</p><input id="lock-pin" class="in pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="الرمز"><p class="err" id="lock-err" role="alert"></p><button class="btn primary" type="submit">فتح</button><button type="button" class="btn sm" data-act="lock-forgot">نسيت الرمز</button></form>';
  document.getElementById('app').appendChild(el);setInert(true);const i=$('#lock-pin');if(i)i.focus();
}
function unlock(){const el=$('#lock');if(el)el.remove();setInert(false);}
async function submitLock(){
  const now=Date.now();const err=$('#lock-err');
  if(now<blockUntil){err.textContent='محاولات كثيرة. انتظر '+Math.ceil((blockUntil-now)/1000)+' ثانية.';return;}
  let ok=false;try{ok=await checkPin(($('#lock-pin').value||'').trim());}catch(e){err.textContent='تعذّر التحقق في هذا المتصفح.';return;}
  if(ok){fails=0;unlock();return;}
  fails++;$('#lock-pin').value='';
  if(fails>=5){blockUntil=Date.now()+30000*(fails-4);err.textContent='رمز خاطئ. انتظر '+30*(fails-4)+' ثانية.';}
  else err.textContent='رمز خاطئ. المحاولات المتبقية قبل الإيقاف المؤقت: '+(5-fails);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();}
  else if(hasPin()&&hiddenAt&&Date.now()-hiddenAt>60000){showLock();}
});

/* ---------- boot ---------- */
S=loadLocal()||seed();
if(!S.settings)S.settings={cal:'both',nu:'latn'};
if(typeof S.rev!=='number')S.rev=0;
ensureShape();
renderView();setSync('local');
if(hasPin())showLock();
initDb();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
setTimeout(()=>{if(!DB.ref)setSync('local');},10000);
})();
